name: Deprecate old package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deprecate-old-package.yml'

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Deprecate iflow-mcp on npm
        run: npm deprecate iflow-mcp@"*" "Renamed: this package moved to iflows-mcp. Install iflows-mcp instead."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
