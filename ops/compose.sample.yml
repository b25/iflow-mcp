# Sample Compose stack: build iflows-mcp and expose HTTP (place behind TLS proxy).
# Copy to compose.yml, set env_file, and replace image/build as needed.

services:
  iflows-mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    image: iflows-mcp:local
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      IFLOW_MCP_TRANSPORT: http
      IFLOW_HTTP_BIND_HOST: "0.0.0.0"
      PORT: "3000"
    ports:
      # Prefer not publishing publicly; use an internal network + edge proxy.
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
